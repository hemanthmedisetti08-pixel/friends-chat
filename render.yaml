services:
  - type: web
    name: friends-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      # --- Voice/video calls: TURN relay (see README). Set the values in the Render dashboard. ---
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: friends-chat-db
          property: connectionString
databases:
  - name: friends-chat-db
    plan: free
